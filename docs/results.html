<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBA-Bench Results Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: "Inter", sans-serif;
      }
      .card {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        padding: 1.5rem;
      }
      .metric-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #38bdf8;
      }
      .metric-label {
        font-size: 0.875rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav
      class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center">
            <span
              class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent"
            >
              FBA-Bench
            </span>
            <div class="ml-10 flex items-baseline space-x-4">
              <a
                href="index.html"
                class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium"
                >Leaderboard</a
              >
              <a
                href="results.html"
                class="bg-slate-800 text-white px-3 py-2 rounded-md text-sm font-medium"
                >Results Explorer</a
              >
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
      <header class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">
          Benchmark Results Explorer
        </h1>
        <p class="text-slate-400">
          Historical performance data for all experiment runs.
        </p>
      </header>

      <!-- Filters -->
      <div class="card mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1"
            >Model</label
          >
          <select
            id="filterModel"
            class="w-full bg-slate-800 border-slate-700 rounded text-sm p-2 text-white"
          >
            <option value="all">All Models</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1"
            >Scenario</label
          >
          <select
            id="filterScenario"
            class="w-full bg-slate-800 border-slate-700 rounded text-sm p-2 text-white"
          >
            <option value="all">All Scenarios</option>
          </select>
        </div>
        <div class="flex items-end">
          <span class="text-sm text-slate-500" id="recordCount"
            >Loading...</span
          >
        </div>
      </div>

      <!-- Charts Row -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
        <div class="card">
          <h3 class="text-lg font-semibold text-white mb-4">
            Profit Over Time
          </h3>
          <canvas id="profitChart"></canvas>
        </div>
        <div class="card">
          <h3 class="text-lg font-semibold text-white mb-4">
            Win Rate Distribution
          </h3>
          <canvas id="winRateChart"></canvas>
        </div>
      </div>

      <!-- Table -->
      <div class="card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-700 text-sm">
            <thead>
              <tr>
                <th class="px-4 py-3 text-left font-semibold text-slate-300">
                  Date
                </th>
                <th class="px-4 py-3 text-left font-semibold text-slate-300">
                  Model
                </th>
                <th class="px-4 py-3 text-left font-semibold text-slate-300">
                  Scenario
                </th>
                <th class="px-4 py-3 text-right font-semibold text-slate-300">
                  Profit
                </th>
                <th class="px-4 py-3 text-right font-semibold text-slate-300">
                  Days
                </th>
                <th class="px-4 py-3 text-center font-semibold text-slate-300">
                  Status
                </th>
                <th class="px-4 py-3 text-left font-semibold text-slate-300">
                  Run ID
                </th>
              </tr>
            </thead>
            <tbody id="resultsTableBody" class="divide-y divide-slate-800">
              <!-- Rows injected via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-900 py-6 mt-8">
      <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
        &copy; 2026 FBA-Bench Enterprise.
      </div>
    </footer>

    <script>
      let allData = [];
      let charts = {};

      async function loadData() {
        try {
          const response = await fetch("data/benchmark_results.json");
          allData = await response.json();
          populateFilters();
          renderFilters();
        } catch (e) {
          console.error("Failed to load data", e);
          document.getElementById("recordCount").innerText =
            "Failed to load data.";
        }
      }

      function populateFilters() {
        const models = new Set();
        const scenarios = new Set();
        allData.forEach((run) => {
          if (run.params?.model) models.add(run.params.model);
          if (run.scenario_id) scenarios.add(run.scenario_id);
        });

        const modelSelect = document.getElementById("filterModel");
        models.forEach((m) => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.innerText = m;
          modelSelect.appendChild(opt);
        });

        const scenarioSelect = document.getElementById("filterScenario");
        scenarios.forEach((s) => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.innerText = s;
          scenarioSelect.appendChild(opt);
        });

        modelSelect.addEventListener("change", renderFilters);
        scenarioSelect.addEventListener("change", renderFilters);
      }

      function renderFilters() {
        const modelFilter = document.getElementById("filterModel").value;
        const scenarioFilter = document.getElementById("filterScenario").value;

        const filtered = allData.filter((run) => {
          const m = run.params?.model || "unknown";
          const s = run.scenario_id || "unknown";
          return (
            (modelFilter === "all" || m === modelFilter) &&
            (scenarioFilter === "all" || s === scenarioFilter)
          );
        });

        document.getElementById("recordCount").innerText =
          `${filtered.length} runs found`;
        renderTable(filtered);
        updateCharts(filtered);
      }

      function renderTable(data) {
        const tbody = document.getElementById("resultsTableBody");
        tbody.innerHTML = "";

        data.forEach((run) => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-800/50 transition-colors";

          const date =
            new Date(run.created_at).toLocaleDateString() +
            " " +
            new Date(run.created_at).toLocaleTimeString();
          const profit = run.metrics?.profit_total || run.metrics?.score || 0;
          const days = run.metrics?.days_survived || 0;
          const model = run.params?.model || "Unknown";

          tr.innerHTML = `
                    <td class="px-4 py-3 text-slate-400 whitespace-nowrap">${date}</td>
                    <td class="px-4 py-3 text-white font-medium">${model}</td>
                    <td class="px-4 py-3 text-slate-400">${run.scenario_id}</td>
                    <td class="px-4 py-3 text-right ${profit >= 0 ? "text-green-400" : "text-red-400"} font-mono">
                        $${Number(profit).toLocaleString()}
                    </td>
                    <td class="px-4 py-3 text-right text-slate-300">${days}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-900 text-green-300">
                            Completed
                        </span>
                    </td>
                    <td class="px-4 py-3 text-slate-600 font-mono text-xs truncate max-w-[100px]" title="${run.id}">
                        ${run.id.substring(0, 8)}...
                    </td>
                `;
          tbody.appendChild(tr);
        });
      }

      function updateCharts(data) {
        // Simplified chart logic
        const ctxProfit = document
          .getElementById("profitChart")
          .getContext("2d");

        if (charts.profit) charts.profit.destroy();

        // Sort by date
        const sorted = [...data].sort(
          (a, b) => new Date(a.created_at) - new Date(b.created_at),
        );

        charts.profit = new Chart(ctxProfit, {
          type: "line",
          data: {
            labels: sorted.map((d) =>
              new Date(d.created_at).toLocaleDateString(),
            ),
            datasets: [
              {
                label: "Profit ($)",
                data: sorted.map(
                  (d) => d.metrics?.profit_total || d.metrics?.score || 0,
                ),
                borderColor: "#38bdf8",
                backgroundColor: "rgba(56, 189, 248, 0.1)",
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { grid: { color: "#334155" } },
              x: { grid: { display: false } },
            },
          },
        });
      }

      // Init
      loadData();
    </script>
  </body>
</html>
