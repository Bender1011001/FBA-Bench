<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBA Competition Benchmark - Live Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: #fff;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .status {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4ade80;
        margin-left: 10px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 15px;
        border-radius: 8px;
        backdrop-filter: blur(10px);
      }

      .stat-label {
        font-size: 0.9em;
        opacity: 0.8;
        margin-bottom: 5px;
      }

      .stat-value {
        font-size: 1.8em;
        font-weight: bold;
      }

      .progress-bar {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin-top: 5px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4ade80, #60a5fa);
        width: 0%;
        transition: width 0.3s ease;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      @media (max-width: 1200px) {
        .main-content {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 20px;
        backdrop-filter: blur(10px);
        max-height: 600px;
        overflow-y: auto;
      }

      .panel h2 {
        margin-bottom: 15px;
        font-size: 1.5em;
        border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        padding-bottom: 10px;
      }

      .leaderboard-row {
        display: grid;
        grid-template-columns: 40px 30px 1fr 120px;
        gap: 10px;
        padding: 10px;
        margin-bottom: 8px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        align-items: center;
        border-left: 3px solid transparent;
      }

      .leaderboard-row:nth-child(1) {
        background: rgba(255, 215, 0, 0.15);
        border-left-color: #ffd700;
      }

      .leaderboard-row:nth-child(2) {
        background: rgba(192, 192, 192, 0.15);
        border-left-color: #c0c0c0;
      }

      .leaderboard-row:nth-child(3) {
        background: rgba(205, 127, 50, 0.15);
        border-left-color: #cd7f32;
      }

      .rank {
        font-weight: bold;
        font-size: 1.1em;
      }

      .avatar {
        font-size: 1.3em;
      }

      .agent-name {
        font-weight: 500;
      }

      .profit {
        font-weight: bold;
        color: #4ade80;
        text-align: right;
      }

      .log-viewer {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 15px;
        font-family: "Courier New", monospace;
        font-size: 0.8em;
        max-height: 400px;
        overflow-y: auto;
        line-height: 1.4;
      }

      .log-line {
        padding: 2px 0;
        opacity: 0.9;
      }

      .log-line.info {
        color: #60a5fa;
      }

      .log-line.warning {
        color: #fbbf24;
      }

      .log-line.error {
        color: #f87171;
      }

      footer {
        text-align: center;
        margin-top: 30px;
        opacity: 0.7;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🏆 FBA Competition Benchmark <span class="status"></span></h1>
        <p>365-Day Live Simulation</p>
      </header>

      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-label">Current Day</div>
          <div class="stat-value" id="current-day">-</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Leader</div>
          <div class="stat-value" id="leader">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Leader Profit</div>
          <div class="stat-value" id="leader-profit">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Last Updated</div>
          <div class="stat-value" id="last-updated" style="font-size: 1em">
            -
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="panel">
          <h2>📊 Live Leaderboard</h2>
          <div id="leaderboard"></div>
        </div>

        <div class="panel">
          <h2>📝 Recent Activity</h2>
          <div class="log-viewer" id="log-viewer"></div>
        </div>
      </div>

      <footer>
        Auto-refreshing every 3 seconds | Last fetched:
        <span id="fetch-time">never</span>
      </footer>
    </div>

    <script>
      async function updateDashboard() {
        try {
          const response = await fetch("/api/log");
          const data = await response.json();
          const content = data.content || "";

          // Parse log content
          const lines = content.split("\n");

          let currentDay = "-";
          let totalDays = 365;
          let leaderboardData = [];
          let recentLogs = [];

          // Extract current day
          for (let line of lines) {
            const match = line.match(/DAY\s+(\d+)\s+\/\s+(\d+)/);
            if (match) {
              currentDay = match[1];
              totalDays = match[2];
            }

            // Extract leaderboard entries
            const boardMatch = line.match(
              /#(\d+)\s+(.+?)\s+\$\s*([0-9,]+\.\d+)/,
            );
            if (boardMatch) {
              leaderboardData.push({
                rank: boardMatch[1],
                name: boardMatch[2].trim(),
                profit: boardMatch[3],
              });
            }

            // Collect recent agent activity
            if (
              line.includes("INFO      competition_benchmark") &&
              (line.includes("price=$") || line.includes("Standings"))
            ) {
              recentLogs.push(line);
            }
          }

          // Update stats
          document.getElementById("current-day").textContent = currentDay;
          const progress = (parseInt(currentDay) / parseInt(totalDays)) * 100;
          document.getElementById("progress-fill").style.width =
            progress.toFixed(1) + "%";

          // Update leaderboard
          let leaderboardHtml = "";
          if (leaderboardData.length > 0) {
            const leader = leaderboardData[0];
            document.getElementById("leader").textContent =
              leader.name.split(" ")[0];
            document.getElementById("leader-profit").textContent =
              "$" + leader.profit;

            leaderboardHtml = leaderboardData
              .slice(0, 11)
              .map((agent, idx) => {
                const medal = { 0: "🥇", 1: "🥈", 2: "🥉" }[idx] || "  ";
                return `
                            <div class="leaderboard-row">
                                <div class="rank">${medal}</div>
                                <div class="avatar"></div>
                                <div class="agent-name">${agent.name}</div>
                                <div class="profit">$${agent.profit}</div>
                            </div>
                        `;
              })
              .join("");
          }

          document.getElementById("leaderboard").innerHTML =
            leaderboardHtml || "<p>Loading data...</p>";

          // Update logs
          const logHtml = recentLogs
            .slice(-10)
            .reverse()
            .map((line) => {
              let className = "log-line info";
              if (line.includes("WARNING") || line.includes("⚠")) {
                className = "log-line warning";
              } else if (line.includes("ERROR")) {
                className = "log-line error";
              }

              // Extract just the important part
              const match = line.match(/competition_benchmark\s+(.+)/);
              const text = match ? match[1] : line;

              return `<div class="${className}">${text.substring(0, 100)}</div>`;
            })
            .join("");

          document.getElementById("log-viewer").innerHTML =
            logHtml || "<p>Loading...</p>";

          // Update timestamp
          const now = new Date();
          document.getElementById("fetch-time").textContent =
            now.toLocaleTimeString();
          document.getElementById("last-updated").textContent = now
            .toLocaleTimeString()
            .split(" ")[0];
        } catch (error) {
          console.error("Error fetching data:", error);
          document.getElementById("leaderboard").innerHTML =
            '<p style="color: #f87171;">Error loading data</p>';
        }
      }

      // Initial load
      updateDashboard();

      // Auto-refresh every 3 seconds
      setInterval(updateDashboard, 3000);
    </script>
  </body>
</html>
